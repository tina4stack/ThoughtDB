[project]
name = "thoughtdb"
version = "0.3.0"
description = "Vector API layer that plugs into any relational database"
authors = [{name = "Andre van Zuydam", email = "andrevanzuydam@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "tina4-python>=0.2.3",
    "numpy>=2.0.1",
    "sqlite-vec>=0.1.6",
    "thought>=0.1.3",
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
]
postgres = ["psycopg2-binary"]
mysql = ["mysql-connector-python"]
firebird = ["firebird-driver"]
mssql = ["pymssql"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
